name: Package and Release DFT Personal Tactics

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate addon and DFT compatibility
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes luajit
          ./scripts/fetch-dft.sh /tmp/dft-upstream
          export DFT_TOC=$(printf '%s\n' /tmp/dft-upstream/DreamForgeTools-*/DreamForgeTools/DreamForgeTools.toc)
          ./scripts/check-dft-update.sh
          luajit tests/addon_test.lua
          luajit -b DFTPersonalTactics.lua /tmp/DFTPersonalTactics.luac

      - name: Package addon
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28 # v2.5.1
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
